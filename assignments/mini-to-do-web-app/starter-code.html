<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini To-Do Web App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        padding: 10px;
        font-size: 16px;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid #ddd;
        margin-bottom: 8px;
      }

      .completed {
        text-decoration: line-through;
        color: #777;
      }
    </style>
  </head>
  <body>
    <h1>My To-Do List</h1>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a new task" />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <script src="starter-code.js"></script>
  </body>
</html>
